[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build options
build_flags = 
    -D CORE_DEBUG_LEVEL=4
    -D CONFIG_ARDUHAL_LOG_COLORS
    -std=gnu++17
    -D FIRMWARE_VERSION="\"v1.0.0-CLEAN\""
    -D WEB_SERVER_PORT=80
    -D WEBSOCKET_PORT=8080
    -D SERIAL_SPEED=115200
    -D DEBUG_ENABLED=1
    -D CONFIG_FREERTOS_UNICORE=0
    -D CONFIG_ESP_TASK_WDT_PANIC=1
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=30

; Libraries for complete CLEAN architecture
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0
    tzapu/WiFiManager@^0.16.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    arduino-libraries/NTPClient@^3.2.1
    lorol/LittleFS_esp32@^1.0.6

; Upload and monitor settings
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Filesystem configuration
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Memory configuration
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.flash_freq = 80m

; C++ standard and optimization
build_unflags = -std=gnu++11
build_type = debug

; ===========================
; ESP32-C3 Super Mini
; ===========================
[env:esp32c3_super_mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Build options
build_flags =
    -D CORE_DEBUG_LEVEL=4
    -D CONFIG_ARDUHAL_LOG_COLORS
    -std=gnu++17
    -D FIRMWARE_VERSION="\"v1.0.0-CLEAN\""
    -D WEB_SERVER_PORT=80
    -D WEBSOCKET_PORT=8080
    -D SERIAL_SPEED=115200
    -D DEBUG_ENABLED=1
    -D CONFIG_FREERTOS_UNICORE=1
    -D CONFIG_ESP_TASK_WDT_PANIC=1
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=30
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    arduino-libraries/NTPClient@^3.2.1

; Upload and monitor settings
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Filesystem configuration
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Memory configuration
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.flash_freq = 80m

; C++ standard and optimization
build_unflags = -std=gnu++11
build_type = debug

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup

; ===========================
; TEST ENVIRONMENT
; ===========================
[env:test]
platform = espressif32
board = esp32dev
framework = arduino

; Test framework configuration
test_framework = unity
test_port = /dev/ttyUSB0
test_speed = 115200

; Build flags for testing
build_flags = 
    -D UNITY_INCLUDE_CONFIG_H
    -D UNIT_TEST
    -D ENABLE_MOCK_HARDWARE
    -D CORE_DEBUG_LEVEL=3
    -std=gnu++17
    -fexceptions
    -Wall
    -Wextra

; Test build configuration
test_build_src = true
test_build_flags = 
    -I test/mocks
    -I test/fixtures
    -I src
    -I include

; Libraries for testing
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0
    tzapu/WiFiManager@^0.16.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    arduino-libraries/NTPClient@^3.2.1
    lorol/LittleFS_esp32@^1.0.6

; Test filters and configuration
test_filter = 
    test_domain/*
    test_application/*
    test_infrastructure/*
    test_integration/*

; Memory configuration for testing
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
build_type = debug
