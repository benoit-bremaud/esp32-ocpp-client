[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build options
build_flags = 
    -D CORE_DEBUG_LEVEL=4
    -D CONFIG_ARDUHAL_LOG_COLORS
    -std=gnu++17
    -D FIRMWARE_VERSION="\"v1.0.0-CLEAN\""
    -D WEB_SERVER_PORT=80
    -D WEBSOCKET_PORT=8080
    -D SERIAL_SPEED=115200
    -D DEBUG_ENABLED=1

; Libraries for complete CLEAN architecture
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0
    tzapu/WiFiManager@^0.16.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    arduino-libraries/NTPClient@^3.2.1
    lorol/LittleFS_esp32@^1.0.6

; Upload and monitor settings
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Filesystem configuration
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Memory configuration
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_build.flash_freq = 80m

; FreeRTOS configuration  
build_flags = 
    ${env:esp32dev.build_flags}
    -D CONFIG_FREERTOS_UNICORE=0
    -D CONFIG_ESP_TASK_WDT_PANIC=1
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=30

; C++ standard and optimization
build_unflags = -std=gnu++11
build_type = debug

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup

; Test configuration
test_framework = unity
test_build_project_src = true